# SonarCloud configuration - replace the two values below with your own
# (SonarCloud -> your project -> Information shows both keys)
sonar.organization=YOUR_SONARCLOUD_ORG
sonar.projectKey=YOUR_SONARCLOUD_ORG_visitor-counter-flask
sonar.projectName=visitor-counter-flask

sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml
sonar.sourceEncoding=UTF-8

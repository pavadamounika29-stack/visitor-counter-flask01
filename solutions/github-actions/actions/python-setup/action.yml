# Composite action: set up Python and install the project's dev dependencies.
name: Python setup
description: Install Python and the project's dev dependencies (with pip cache)

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"

outputs:
  python-version:
    description: The exact Python version that was installed
    value: ${{ steps.setup.outputs.python-version }}

runs:
  using: composite
  steps:
    - id: setup
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dependencies
      shell: bash
      run: pip install -r requirements-dev.txt

# Reusable workflow: build a Docker image, scan it with Trivy, optionally push it.
# Called by ci.yml (push: false) and cd.yml (push: true).
name: Reusable - Docker build, scan, push

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name without registry/user, e.g. visitor-counter
        type: string
        required: true
      push:
        description: Push the image to Docker Hub
        type: boolean
        default: false
    secrets:
      DOCKERHUB_TOKEN:
        required: false
    outputs:
      image:
        description: Full image reference that was built
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
    env:
      TRIVY_IMAGE: aquasec/trivy:0.75.0
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name and tag
        id: vars
        run: |
          TAG="gha-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          REPO="${{ vars.DOCKERHUB_USERNAME || 'local' }}/${{ inputs.image-name }}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "repo=$REPO"       >> "$GITHUB_OUTPUT"
          echo "image=$REPO:$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build image (loaded into the runner's Docker)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: |
            ${{ steps.vars.outputs.repo }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.repo }}:latest
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (/version)
        run: |
          docker run -d --rm --name smoke -p 15000:5000 ${{ steps.vars.outputs.image }}
          for i in $(seq 1 15); do curl -fsS localhost:15000/version && break; sleep 2; done
          echo
          curl -fsS localhost:15000/version | grep -F "${{ steps.vars.outputs.tag }}"
          docker rm -f smoke

      - name: Trivy image scan (report + gate on fixable CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --quiet --severity HIGH,CRITICAL --ignore-unfixed ${{ steps.vars.outputs.image }}
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --quiet --severity CRITICAL --ignore-unfixed --exit-code 1 ${{ steps.vars.outputs.image }}

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: inputs.push
        run: |
          docker push ${{ steps.vars.outputs.repo }}:${{ steps.vars.outputs.tag }}
          docker push ${{ steps.vars.outputs.repo }}:latest
